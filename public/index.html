<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Boxwood Vault</title>
  <style>
    body { font-family: monospace; background: #f4f4f4; color: #111; padding: 20px; }
    h1 { text-align: center; font-size: 2rem; border-bottom: 2px solid #111; padding-bottom: 10px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 20px; margin-top: 20px; }
    .card { background: #fff; padding: 10px; border: 2px solid #111; cursor: pointer; text-align: center; }
    .card img { width: 100%; height: auto; border-bottom: 2px solid #111; margin-bottom: 10px; }
    dialog { border: 2px solid #111; padding: 20px; max-width: 400px; background: #fff; }
    dialog::backdrop { background: rgba(0,0,0,0.8); }
    button { background: #111; color: #fff; border: none; padding: 12px; cursor: pointer; font-family: inherit; width: 100%; margin-top: 10px; font-weight: bold; }
    button:disabled { background: #666; cursor: not-allowed; }
    input[type="email"] { width: 100%; padding: 10px; margin-bottom: 10px; box-sizing: border-box; font-family: inherit; border: 2px solid #111; }
    #high_res_download_link { display: block; margin-top: 15px; background: #000; color: #fff; padding: 12px; text-decoration: none; text-align: center; font-weight: bold; }
  </style>
</head>
<body>
  <h1>BOXWOOD VAULT</h1>
  <div class="grid" id="wallpaper_grid"></div>

  <!-- Hidden iframe for server response capture -->
  <iframe name="kit_capture" id="kit_capture" style="display:none;"></iframe>

  <dialog id="gate_modal">
    <div class="modal-content">
      <p style="font-weight: bold; text-align: center;">FULL RESOLUTION REQUESTED</p>
      <p style="text-align: center; font-size: 0.9rem;">Standard resolution stays free.<br>No email required for standard files.</p>
      <form id="vault_access_form" action="https://app.kit.com/forms/YOUR_FORM_ID/subscriptions" method="POST" target="kit_capture">
        <input type="email" name="email_address" required placeholder="Enter email address." />
        <label style="display:block; margin-bottom:10px; font-size: 0.8rem; cursor: pointer;">
          <input type="checkbox" name="marketing_opt_in" />
          Add this address to the Boxwood email list. Apparel notes only. Optional.
        </label>
        <button type="submit" id="transmit_button">[ TRANSMIT LINK ]</button>
      </form>
      <a href="#" id="high_res_download_link" style="display:none;" target="_blank">[ DOWNLOAD FULL RES ]</a>
      <p style="text-align: center; font-size: 0.8rem; margin-top: 15px;">One link is sent. Open it to unlock.<br><a href="/privacy" style="color: #111;">Privacy Policy</a></p>
      <button onclick="document.getElementById('gate_modal').close()" style="background: transparent; color: #111; border: 2px solid #111;">[ CANCEL ]</button>
    </div>
  </dialog>

  <script>
    // Cloudinary Utilities
    function constructTransformationUrl(baseUrl, parameters) {
      const urlParts = baseUrl.split('/upload/');
      if (urlParts.length !== 2) return baseUrl;
      return `${urlParts[0]}/upload/${parameters}/${urlParts[1]}`;
    }

    function getHardwareMetrics() {
      const pixelRatio = window.devicePixelRatio || 1;
      const targetWidth = Math.round(window.screen.width * pixelRatio);
      const targetHeight = Math.round(window.screen.height * pixelRatio);
      return { width: targetWidth, height: targetHeight };
    }

    // Grid Rendering
    function initializeGrid(database) {
      const grid = document.getElementById('wallpaper_grid');
      if(!database.assets) return;
      
      database.assets.forEach(asset => {
        const card = document.createElement('div');
        card.className = 'card';
        
        const img = document.createElement('img');
        img.src = constructTransformationUrl(asset.base_image_url, 'c_limit,w_400,q_auto,f_auto');
        img.alt = asset.title;
        
        const title = document.createElement('h3');
        title.textContent = asset.title;
        title.style.fontSize = '1rem';
        
        card.appendChild(img);
        card.appendChild(title);
        
        card.onclick = () => {
          document.body.dataset.activeBaseUrl = asset.base_image_url;
          document.body.dataset.activeGravity = asset.gravity || 'auto';
          
          // Reset modal state
          document.getElementById('high_res_download_link').style.display = 'none';
          document.getElementById('vault_access_form').style.display = 'block';
          document.getElementById('transmit_button').disabled = false;
          document.getElementById('transmit_button').innerText = '[ TRANSMIT LINK ]';
          
          document.getElementById('gate_modal').showModal();
        };
        
        grid.appendChild(card);
      });
    }

    // Fetch Logic (Qwen Approved)
    async function fetchVaultDatabase() {
      const requestUrl = `/wallpapers.json?v=${Date.now()}`;
      try {
        const response = await fetch(requestUrl, { cache: 'no-store' });
        if (!response.ok) throw new Error('Database response failed.');
        const database = await response.json();
        initializeGrid(database);
      } catch (error) {
        console.error('Database fetch failed:', error);
      }
    }

    // Kit Form Submission Logic (Qwen Approved)
    const captureFrame = document.getElementById('kit_capture');
    const accessForm = document.getElementById('vault_access_form');
    const transmitButton = document.getElementById('transmit_button');
    const consentCheckbox = document.querySelector('input[name="marketing_opt_in"]');
    const gateModal = document.getElementById('gate_modal');
    // NOTE: We will replace YOUR_FORM_ID later when you have your Kit form ready
    const kitEndpoint = 'https://app.kit.com/forms/YOUR_FORM_ID/subscriptions'; 

    let timeoutHandle;
    let isSubmitting = false;

    function handleIframeLoad() {
      if (!isSubmitting) return; 
      isSubmitting = false;
      clearTimeout(timeoutHandle);
      
      // Hide the form and show the download button
      accessForm.style.display = 'none';
      unlockHighResolutionAsset();
    }

    captureFrame.addEventListener('load', handleIframeLoad);

    accessForm.addEventListener('submit', function(event) {
      event.preventDefault(); 
      
      isSubmitting = true;
      transmitButton.disabled = true;
      transmitButton.innerText = '[ TRANSMITTING ]';

      if (consentCheckbox.checked) {
        accessForm.action = kitEndpoint;
      } else {
        accessForm.action = 'about:blank';
      }

      timeoutHandle = setTimeout(function() {
        if (isSubmitting) {
          console.error('Handshake timeout. Interface reset enforced.');
          isSubmitting = false;
          transmitButton.disabled = false;
          transmitButton.innerText = '[ TRANSMIT LINK ]';
        }
      }, 5000);

      accessForm.submit(); 
    });

    function unlockHighResolutionAsset() {
      const activeBaseUrl = document.body.dataset.activeBaseUrl;
      const activeGravity = document.body.dataset.activeGravity;
      
      if (activeBaseUrl && activeGravity) {
        const metrics = getHardwareMetrics();
        const exactResolutionUrl = constructTransformationUrl(
          activeBaseUrl, 
          `c_lfill,w_${metrics.width},h_${metrics.height},g_${activeGravity},q_auto,f_auto`
        );
        
        const downloadAnchor = document.getElementById('high_res_download_link');
        if (downloadAnchor) {
          downloadAnchor.href = exactResolutionUrl;
          downloadAnchor.download = 'boxwood-vault-asset.jpg'; 
          downloadAnchor.style.display = 'block'; // Reveal the download button
        }
      }
    }

    // Initialize the page
    fetchVaultDatabase();
  </script>
</body>
</html>
